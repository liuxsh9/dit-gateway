services:
  caddy:
    image: caddy:2.9
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  gateway:
    image: ${GATEWAY_IMAGE:-dit-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
      - "${SSH_EXPOSE:-127.0.0.1:2222}:22"
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      FORGEJO__server__ROOT_URL: "${ROOT_URL:-http://localhost:3000/}"
      FORGEJO__server__DOMAIN: "${DOMAIN:-localhost}"
      FORGEJO__server__SSH_DOMAIN: "${DOMAIN:-localhost}"
      FORGEJO__server__SSH_PORT: "${SSH_PORT:-2222}"
      FORGEJO__server__DISABLE_SSH: "${DISABLE_SSH:-true}"
      FORGEJO__i18n__LANGS: en-US
      FORGEJO__i18n__NAMES: English
      FORGEJO__service__DISABLE_REGISTRATION: "${DISABLE_REGISTRATION:-true}"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "${REQUIRE_SIGNIN_VIEW:-false}"
      FORGEJO__repository__MAX_CREATION_LIMIT: "${USER_REPO_CREATION_LIMIT:-0}"
      FORGEJO__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "${ALLOW_USER_ORG_CREATION:-false}"
      FORGEJO__admin__DISABLE_REGULAR_ORG_CREATION: "${DISABLE_REGULAR_ORG_CREATION:-true}"
      FORGEJO__datahub__ENABLED: "true"
      FORGEJO__datahub__CORE_URL: "http://core:8000"
      FORGEJO__datahub__SERVICE_TOKEN: "${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}"
    depends_on:
      db:
        condition: service_healthy
      core:
        condition: service_healthy
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  core:
    image: ${CORE_IMAGE:-dit-core:local}
    build:
      context: ${CORE_BUILD_CONTEXT:-../dit}
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      DIT_SERVER_DATABASE_URL: "postgresql+asyncpg://dit:${DIT_DB_PASSWORD:?set DIT_DB_PASSWORD in .env}@db:5432/dit"
      DIT_SERVER_DATA_DIR: "/data/dit"
      DIT_SERVER_SERVICE_TOKEN: "${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - core-data:/data/dit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: forgejo
      DIT_DB_PASSWORD: "${DIT_DB_PASSWORD:?set DIT_DB_PASSWORD in .env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:
  forgejo-data:
  core-data:
  pg-data:
